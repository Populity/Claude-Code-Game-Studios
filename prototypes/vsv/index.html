<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>VSV Clip Battles</title>
<style>
:root{
  --bg:#000;--bg2:#121212;--bg3:#1f1f1f;--line:#262626;--fg:#f5f5f5;--mut:#a8a8a8;
  --blue:#C6FF3D;--ink:#0b0b0b;--red:#ff3040;--ok:#3ddc84;--gold:#ffcc33;
  --ig:linear-gradient(135deg,#C6FF3D 0%,#3DFFB0 55%,#22D3EE 100%);
  --spring:cubic-bezier(.34,1.56,.64,1);--out:cubic-bezier(.22,1,.36,1);--in:cubic-bezier(.64,0,.78,0);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:var(--fg)}
svg{display:block}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;overflow:hidden;background:var(--bg)}
.reduce *{animation-duration:1ms!important;transition-duration:1ms!important}

/* ---------- pages & transitions ---------- */
.page{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);will-change:transform,opacity}
.page.enter{animation:pageIn .42s var(--out) both}
.page.leave{animation:pageOut .3s var(--in) both;pointer-events:none}
.page.enter.back{animation-name:pageInBack}.page.leave.back{animation-name:pageOutBack}
@keyframes pageIn{from{transform:translateX(28%);opacity:0}to{transform:none;opacity:1}}
@keyframes pageOut{to{transform:translateX(-18%);opacity:0}}
@keyframes pageInBack{from{transform:translateX(-28%);opacity:0}}
@keyframes pageOutBack{to{transform:translateX(18%);opacity:0}}
.fade.enter{animation:fadeIn .35s var(--out) both}.fade.leave{animation:fadeOut .25s both}
@keyframes fadeIn{from{opacity:0;transform:scale(1.03)}}@keyframes fadeOut{to{opacity:0;transform:scale(.98)}}
.stagger>*{animation:rise .55s var(--out) both}
.stagger>*:nth-child(1){animation-delay:.04s}.stagger>*:nth-child(2){animation-delay:.09s}.stagger>*:nth-child(3){animation-delay:.14s}
.stagger>*:nth-child(4){animation-delay:.19s}.stagger>*:nth-child(5){animation-delay:.24s}.stagger>*:nth-child(6){animation-delay:.29s}
.stagger>*:nth-child(7){animation-delay:.34s}.stagger>*:nth-child(n+8){animation-delay:.39s}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}}

/* ---------- common ---------- */
.top{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:52px}
.top h1{font-size:22px;font-weight:700;letter-spacing:-.3px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logo{font-size:28px;font-weight:900;font-style:italic;letter-spacing:-1.5px;background:var(--ig);-webkit-background-clip:text;background-clip:text;color:transparent;flex:1}
.icon{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ibtn{padding:6px;border-radius:50%;transition:transform .2s var(--spring)}
.ibtn:active{transform:scale(.82)}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px 16px;border-radius:12px;background:var(--blue);color:var(--ink);font-weight:700;transition:transform .18s var(--spring),filter .2s,opacity .2s}
.btn:active{transform:scale(.96);filter:brightness(.9)}
.btn.light{background:#fff;color:#000}
.btn.ig{background:var(--ig);color:var(--ink);background-size:200% 200%;animation:igShift 6s ease infinite}
.btn.sec{background:var(--bg3);color:var(--fg)}
.btn:disabled{opacity:.35;pointer-events:none}
@keyframes igShift{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
.mut{color:var(--mut);font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;background:var(--bg3);font-size:14px;font-weight:500;white-space:nowrap;transition:transform .25s var(--spring),background .25s,color .25s}
.chip:active{transform:scale(.9)}
.chip.on{background:var(--fg);color:#000}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.hscroll{display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none;flex:none}.hscroll::-webkit-scrollbar{display:none}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:999px;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
.b-qual{background:#ffffff26;color:#fff;backdrop-filter:blur(8px)}.b-king{background:var(--gold);color:#000}
.b-out{background:var(--red);color:#fff}.b-active{background:var(--ok);color:#000}
.av{border-radius:50%;padding:2px;background:var(--ig);flex:none}
.av>div{width:100%;height:100%;border-radius:50%;border:2px solid var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700;background:#333}
.appicon{border-radius:26px;background:var(--ig);display:flex;align-items:center;justify-content:center}
.appicon .icon{stroke:var(--ink);width:55%;height:55%;stroke-width:2.2}

/* ---------- tab bar ---------- */
.tabbar{display:flex;justify-content:space-around;align-items:center;height:calc(54px + var(--safe-b));padding-bottom:var(--safe-b);border-top:1px solid var(--line);background:#000;position:relative;z-index:5;flex:none}
.tabbar button{flex:1;height:100%;display:flex;align-items:center;justify-content:center;color:var(--fg);position:relative}
.tabbar button .icon{transition:transform .35s var(--spring)}
.tabbar button.on .icon{stroke-width:2.7}
.tabbar .pop{animation:tabPop .45s var(--spring)}
@keyframes tabPop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.tabbar .me{width:27px;height:27px;border-radius:50%;background:var(--ig);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--ink);transition:box-shadow .25s}
.tabbar button.on .me{box-shadow:0 0 0 2px #000,0 0 0 3.5px #fff}

/* ---------- onboarding ---------- */
.splash{align-items:center;justify-content:center;gap:18px}
.splash .appicon{width:110px;height:110px;border-radius:30px;animation:markIn 1s var(--spring) both,glow 2.4s ease-in-out .9s infinite}
.splash .word{font-size:34px;font-weight:800;letter-spacing:-1px;animation:rise .7s var(--out) .35s both}
@keyframes markIn{0%{transform:scale(0) rotate(-140deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes glow{50%{box-shadow:0 0 60px #3DFFB088,0 0 120px #3B82F644}}
.onb{padding:24px 20px calc(24px + var(--safe-b));gap:16px;justify-content:flex-end}
.onb h2{font-size:28px;font-weight:800;letter-spacing:-.6px;line-height:1.1}
.onb .hero{flex:1;display:flex;align-items:center;justify-content:center;position:relative}
.orb{position:absolute;border-radius:50%;filter:blur(40px);opacity:.55;animation:float 9s ease-in-out infinite}
@keyframes float{50%{transform:translate(20px,-30px) scale(1.15)}}
.duo{display:flex;gap:10px;transform:rotate(-6deg)}
.duo>div{width:130px;height:220px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:56px;box-shadow:0 20px 60px #0009;animation:duoIn .9s var(--spring) both}
.duo>div:nth-child(2){margin-top:30px;animation-delay:.12s}
@keyframes duoIn{from{opacity:0;transform:translateY(80px) rotate(10deg)}}
.vsbig{position:absolute;font-size:44px;font-weight:900;font-style:italic;background:var(--ig);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 20px #000);animation:vsPulse 1.6s var(--spring) .7s infinite}
@keyframes vsPulse{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}}
.lang{display:flex;gap:10px}.lang .chip{flex:1;justify-content:center;padding:12px}
.perm{display:flex;gap:12px;align-items:center;padding:14px;border-radius:14px;background:var(--bg2)}
.perm .t{font-weight:600}.perm .d{color:var(--mut);font-size:13px;margin-top:2px}
.sw{flex:none;width:46px;height:28px;border-radius:999px;background:#3a3a3a;position:relative;transition:background .25s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .35s var(--spring)}
.sw.on{background:var(--blue)}.sw.on::after{transform:translateX(18px)}
.sw.lock{opacity:.6}
.note{font-size:12px;color:var(--mut);padding:10px 12px;border-radius:10px;border:1px solid var(--line)}
.scan{position:relative;width:140px;height:140px}
.scan .ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(#C6FF3D,#8CFF5A,#3DFFB0,#22D3EE,#3B82F6,transparent 85%);animation:spin 1.1s linear infinite;-webkit-mask:radial-gradient(circle,transparent 62%,#000 63%);mask:radial-gradient(circle,transparent 62%,#000 63%)}
.scan .core{position:absolute;inset:18px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:44px;animation:breathe 1.4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes breathe{50%{transform:scale(.9)}}
.found .chip{animation:chipIn .5s var(--spring) both}
@keyframes chipIn{from{opacity:0;transform:scale(.3) translateY(20px)}}
.mock{border:1px dashed #555;border-radius:14px;padding:16px;background:var(--bg2)}

/* ---------- stories (topics) ---------- */
.stories{display:flex;gap:14px;overflow-x:auto;padding:4px 14px 10px;scrollbar-width:none;flex:none}.stories::-webkit-scrollbar{display:none}
.story{display:flex;flex-direction:column;align-items:center;gap:5px;width:68px;flex:none;font-size:12px;transition:transform .25s var(--spring)}
.story:active{transform:scale(.9)}
.story .av{width:66px;height:66px;border-radius:22px}.story .av>div{border-radius:20px}.story .av>div{font-size:28px}
.story.seen .av{background:#444}
.story.cur .av{background:var(--ig);animation:curPulse 1.8s ease-in-out infinite}
@keyframes curPulse{50%{box-shadow:0 0 18px #C6FF3Daa;transform:scale(1.04)}}
.story span{max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- battle feed ---------- */
.feed{flex:1;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;position:relative}
.feed::-webkit-scrollbar{display:none}
.battle{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:flex;flex-direction:column;padding:0 0 10px}
.arena{flex:1;position:relative;display:flex;gap:3px;overflow:hidden}
.half{flex:1;position:relative;overflow:hidden;transition:flex .6s var(--out),filter .5s,opacity .5s;border-radius:4px;touch-action:pan-y}
.arena.seq .half{position:absolute;inset:0;transition:transform .5s var(--out),opacity .4s}
.arena.seq .half.hide{transform:translateX(100%);opacity:0;pointer-events:none}
.arena.seq .half[data-side="0"].hide{transform:translateX(-100%)}
.arena.voted .half.win{flex:1.9}
.arena.voted .half.lose{filter:grayscale(1) brightness(.45)}
.media{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.media video,.media iframe{width:100%;height:100%;object-fit:cover;border:0;background:#000}
.fake{position:absolute;inset:-20%;background-size:300% 300%;animation:fakeMove 7s ease-in-out infinite}
@keyframes fakeMove{0%,100%{background-position:0% 30%}50%{background-position:100% 70%}}
.fake-emoji{position:relative;font-size:64px;animation:bob 2.2s ease-in-out infinite;filter:drop-shadow(0 8px 24px #0008)}
@keyframes bob{50%{transform:translateY(-14px) rotate(6deg) scale(1.06)}}
.spark{position:absolute;bottom:0;font-size:22px;opacity:.75;animation:drift 6s linear infinite}
@keyframes drift{from{transform:translateY(120%) rotate(0)}to{transform:translateY(-900%) rotate(240deg)}}
.prog{position:absolute;top:8px;left:8px;right:8px;height:2.5px;border-radius:2px;background:#ffffff40;overflow:hidden;z-index:2}
.prog i{display:block;height:100%;width:100%;background:#fff;transform-origin:left;animation:progress 8s linear infinite}
@keyframes progress{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.meta{position:absolute;left:0;right:0;bottom:0;padding:40px 10px 10px;background:linear-gradient(transparent,#000c);z-index:2;display:flex;flex-direction:column;gap:5px;pointer-events:none}
.who{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px;flex-wrap:wrap}
.who .av{width:26px;height:26px}.who .av>div{font-size:11px}
.cap{font-size:12.5px;opacity:.9;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sideTag{position:absolute;top:18px;left:10px;z-index:3;font-weight:900;font-size:13px;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#000a;backdrop-filter:blur(6px)}
.more{position:absolute;top:16px;right:8px;z-index:5;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#0006;backdrop-filter:blur(6px)}
.more .icon{width:20px;height:20px}
.arena .seenTag{right:46px}
.rights{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--mut);margin-top:12px;cursor:pointer}
.rights input{width:20px;height:20px;accent-color:#C6FF3D;flex:none;margin-top:1px}
.seenTag{position:absolute;top:18px;right:10px;z-index:3;font-size:11px;padding:3px 8px;border-radius:999px;background:#000a;backdrop-filter:blur(6px);animation:chipIn .4s var(--spring)}
.vs{position:absolute;left:50%;top:44%;z-index:4;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-style:italic;font-size:20px;pointer-events:none}
.vs::before{content:"";position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(#C6FF3D,#8CFF5A,#3DFFB0,#22D3EE,#3B82F6,#C6FF3D);z-index:-2;animation:spin 3s linear infinite}
.vs::after{content:"";position:absolute;inset:0;border-radius:50%;background:#000;z-index:-1}
.vs span{background:var(--ig);-webkit-background-clip:text;background-clip:text;color:transparent}
.battle.active .vs{animation:clash .9s var(--spring) both}
@keyframes clash{0%{transform:translate(-50%,-50%) scale(0) rotate(-180deg)}70%{transform:translate(-50%,-50%) scale(1.25) rotate(10deg)}100%{transform:translate(-50%,-50%) scale(1)}}
.battle.active .arena:not(.seq) .half[data-side="0"]{animation:slideL .7s var(--out) both}.battle.active .arena:not(.seq) .half[data-side="1"]{animation:slideR .7s var(--out) both}
@keyframes slideL{from{transform:translateX(-40%);opacity:.2}}@keyframes slideR{from{transform:translateX(40%);opacity:.2}}
.arena.seq .vs,.arena.voted .vs{opacity:0;transition:opacity .3s}
.ctrl{display:flex;align-items:center;gap:8px;padding:10px 12px 0}
.seg{display:flex;background:var(--bg3);border-radius:10px;padding:3px;position:relative}
.seg button{position:relative;z-index:1;padding:6px 11px;font-size:13px;font-weight:600;color:var(--mut);transition:color .25s}
.seg button.on{color:#000}
.seg .knob{position:absolute;top:3px;bottom:3px;border-radius:8px;background:#fff;transition:left .4s var(--spring),width .4s var(--spring)}
.ctrl .sp{flex:1}
.votes{display:flex;gap:8px;padding:10px 12px 0}
.vbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:12px;border-radius:12px;background:var(--bg3);font-weight:700;transition:transform .2s var(--spring),background .3s,opacity .3s}
.vbtn:active{transform:scale(.93)}
.vbtn .icon{width:20px;height:20px}
.vbtn.pick{background:var(--blue);color:var(--ink);animation:tabPop .5s var(--spring)}
.vbtn.pick .icon{fill:var(--ink)}
.vbtn:disabled{opacity:.35}
.hint{padding:8px 12px 0;text-align:center;color:var(--mut);font-size:12.5px;min-height:24px}
.result{position:absolute;top:64%;z-index:6;transform:translate(-50%,-50%);text-align:center;pointer-events:none;animation:resultIn .7s var(--spring) both}
.result .big{font-size:40px;font-weight:900;letter-spacing:-1px;text-shadow:0 6px 30px #000}
.result .delta{font-size:16px;font-weight:700;color:var(--ok);text-shadow:0 2px 10px #000}
@keyframes resultIn{from{opacity:0;transform:translate(-50%,-30%) scale(.4)}}
.heart{position:absolute;z-index:7;pointer-events:none;width:110px;height:110px;margin:-55px 0 0 -55px;animation:heart .9s var(--spring) forwards}
.heart svg{width:100%;height:100%;fill:#C6FF3D;stroke:#000;stroke-width:.6;filter:drop-shadow(0 6px 20px #0008)}
@keyframes heart{0%{transform:scale(0) rotate(-20deg);opacity:0}25%{transform:scale(1.25) rotate(8deg);opacity:1}45%{transform:scale(.95)}70%{transform:scale(1.05);opacity:1}100%{transform:scale(1.2) translateY(-60px);opacity:0}}
.particle{position:absolute;z-index:6;pointer-events:none;border-radius:2px;animation:burst 1s var(--out) forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.2);opacity:0}}
.skel{background:linear-gradient(100deg,#1a1a1a 30%,#2a2a2a 50%,#1a1a1a 70%);background-size:300% 100%;animation:shimmer 1.3s linear infinite}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-100% 0}}

/* ---------- explore ---------- */
.search{margin:0 16px 12px;display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;background:var(--bg3)}
.search input{flex:1;background:none;border:0;outline:0;min-width:0}
.search .icon{width:18px;height:18px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-flow:dense;gap:2px;padding-bottom:20px}
.tile{position:relative;aspect-ratio:3/4;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:transform .3s var(--spring)}
.tile:active{transform:scale(.95)}
.tile.tall{grid-row:span 2;aspect-ratio:auto}
.tile .e{font-size:38px;animation:bob 3s ease-in-out infinite}
.tile .n{font-weight:700;font-size:13px;text-shadow:0 2px 8px #0008;position:relative}
.tile .c{font-size:11px;opacity:.85;position:relative}

/* ---------- ranking ---------- */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;padding:44px 16px 18px}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;width:31%}
.pod .av{width:64px;height:64px}.pod.p1 .av{width:84px;height:84px}
.pod .av>div{font-size:30px}
.pod .col{width:100%;border-radius:12px 12px 0 0;background:linear-gradient(#2a2a2a,#111);display:flex;align-items:flex-start;justify-content:center;padding-top:8px;font-weight:900;font-size:22px;transform-origin:bottom;animation:grow .9s var(--spring) both}
.pod.p1 .col{height:110px;background:linear-gradient(#5c4a10,#1a1505);animation-delay:.25s}.pod.p2 .col{height:80px;animation-delay:.1s}.pod.p3 .col{height:60px;animation-delay:.4s}
@keyframes grow{from{transform:scaleY(0)}}
.crown{font-size:30px;margin-bottom:-12px;animation:crownDrop 1s var(--spring) .8s both;z-index:1}
@keyframes crownDrop{0%{transform:translateY(-80px) rotate(-30deg);opacity:0}100%{transform:none;opacity:1}}
.pod .h{font-size:12px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row{display:flex;align-items:center;gap:10px;padding:10px 16px}
.row .rk{width:22px;text-align:center;font-weight:700;color:var(--mut)}
.row .av{width:44px;height:44px}.row .av>div{font-size:20px}
.row .info{flex:1;min-width:0}.row .info b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .score{font-weight:800;font-variant-numeric:tabular-nums;width:44px;text-align:right}

/* ---------- profile ---------- */
.ph{display:flex;align-items:center;gap:22px;padding:6px 16px 12px}
.ph .av{width:88px;height:88px}.ph .av>div{font-size:34px}
.stats{flex:1;display:flex;justify-content:space-around;text-align:center}
.stats b{display:block;font-size:18px}
.bio{padding:0 16px 12px}
.bio b{display:block}
.ptabs{display:flex;border-top:1px solid var(--line)}
.ptabs button{flex:1;padding:11px;display:flex;justify-content:center;color:var(--mut);border-top:1px solid transparent;margin-top:-1px;transition:color .2s,border-color .2s}
.ptabs button.on{color:var(--fg);border-color:var(--fg)}
.mygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.mycell{position:relative;aspect-ratio:9/16;overflow:hidden;background:#111}
.mycell .ov{position:absolute;left:0;right:0;bottom:0;padding:6px;background:linear-gradient(transparent,#000d);font-size:11px;display:flex;flex-direction:column;gap:4px}
.dots{display:flex;gap:2px}.dots i{flex:1;height:3px;border-radius:2px;background:#ffffff40}
.dots i.w{background:var(--ok)}.dots i.l{background:var(--red)}
.mycell .badge{position:absolute;top:6px;left:6px}
.empty{padding:50px 30px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty .big{width:76px;height:76px;border-radius:50%;border:2px solid var(--fg);display:flex;align-items:center;justify-content:center}

/* ---------- sheets ---------- */
.scrim{position:absolute;inset:0;z-index:30;background:#0009;animation:fadeIn .3s both}
.scrim.out{animation:fadeOut .25s both}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:31;max-height:92%;overflow-y:auto;background:#1c1c1c;border-radius:18px 18px 0 0;padding:8px 16px calc(18px + var(--safe-b));animation:sheetUp .5s var(--out) both}
.sheet.out{animation:sheetDown .3s var(--in) both}
@keyframes sheetUp{from{transform:translateY(100%)}}@keyframes sheetDown{to{transform:translateY(100%)}}
.grab{width:40px;height:4px;border-radius:2px;background:#555;margin:2px auto 12px}
.sheet h3{text-align:center;font-size:16px;margin-bottom:14px}
.opt{display:flex;align-items:center;gap:14px;padding:14px 4px;border-radius:12px;transition:background .2s,transform .2s var(--spring);width:100%;text-align:left}
.opt:active{background:#2a2a2a;transform:scale(.98)}
.opt .oi{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}
.opt .oi .icon{width:24px;height:24px;stroke:var(--ink)}
.opt b{display:block}
.field{width:100%;padding:12px;border-radius:12px;background:var(--bg3);border:1px solid transparent;outline:0;transition:border-color .2s}
.field:focus{border-color:#555}
.preview{width:120px;aspect-ratio:9/16;border-radius:12px;overflow:hidden;position:relative;flex:none;background:#111}
.compose{display:flex;gap:12px;margin-bottom:6px}
.compose textarea{flex:1;resize:none;height:120px}
.lbl{font-size:13px;font-weight:600;margin:14px 0 8px;display:flex;justify-content:space-between;gap:8px}
.ringwrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:30px 0;position:relative}
.ringwrap svg{width:110px;height:110px;transform:rotate(-90deg)}
.ringwrap circle{fill:none;stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .12s linear}
.ringwrap .pct{position:absolute;top:70px;font-size:22px;font-weight:800}
.err{color:var(--red);font-size:13px;margin-top:6px;animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* ---------- camera ---------- */
.cam{background:#000;z-index:40}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cam.env video{transform:none}
.cam .camtop{position:relative;z-index:2;display:flex;justify-content:space-between;padding:14px}
.cam .camtop .ibtn{background:#0006;backdrop-filter:blur(8px)}
.cam .shut{position:absolute;bottom:calc(40px + var(--safe-b));left:50%;transform:translateX(-50%);z-index:2;width:86px;height:86px}
.cam .shut svg{position:absolute;inset:0;transform:rotate(-90deg)}
.cam .shut .dot{position:absolute;inset:12px;border-radius:50%;background:#fff;transition:all .35s var(--spring)}
.cam .shut.rec .dot{inset:26px;border-radius:9px;background:var(--red)}
.cam .timer{position:absolute;top:70px;left:50%;transform:translateX(-50%);z-index:2;padding:4px 10px;border-radius:8px;background:var(--red);font-weight:700;font-variant-numeric:tabular-nums;opacity:0;transition:opacity .2s}
.cam .timer.on{opacity:1}
.cam .camerr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center;color:var(--mut)}

/* ---------- toast & celebration ---------- */
.toast{position:absolute;left:12px;right:12px;top:12px;z-index:60;padding:12px 14px;border-radius:14px;background:#262626ee;backdrop-filter:blur(14px);font-weight:500;display:flex;gap:10px;align-items:center;animation:toastIn .5s var(--spring) both;box-shadow:0 10px 40px #0008}
.toast.out{animation:toastOut .3s var(--in) both}
@keyframes toastIn{from{transform:translateY(-140%)}}@keyframes toastOut{to{transform:translateY(-140%);opacity:0}}
.celebrate{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:radial-gradient(circle at 50% 45%,#000a,#000e);animation:fadeIn .3s both;text-align:center;padding:30px}
.celebrate .ico{font-size:96px;animation:crownDrop .9s var(--spring) both}
.celebrate h2{font-size:28px;font-weight:900;animation:rise .6s var(--out) .3s both}
.celebrate p{color:var(--mut);animation:rise .6s var(--out) .45s both}
.celebrate.fail .ico{animation:failDrop 1s var(--out) both}
.celebrate.out{animation:fadeOut .4s both}
@keyframes failDrop{0%{transform:scale(1.6);opacity:0;filter:blur(6px)}40%{transform:scale(1);opacity:1;filter:none}55%{transform:rotate(-8deg)}70%{transform:rotate(6deg)}100%{transform:none}}
canvas.fx{position:absolute;inset:0;width:100%;height:100%;z-index:55;pointer-events:none}

// ---- Game logic (pure) -----------------------------------------------------
/** Status rule: 10 qualifying battles; ≥7 losses → out; after qualification >70% wins → king. */
function statusOf(r) {
  const n = r.w + r.l;
  if (r.status === "out") return "out";
  if (n <= RULES.qualBattles && r.l >= RULES.maxQualLosses) return "out";
  if (n < RULES.qualBattles) return "qual";
  return r.w / n > RULES.kingWinRate ? "king" : "active";
}
/** Matchmaking: same topic, never eliminated; qualifiers and kings are weighted up, recently seen down. */
function pickPair(topicId, avoid = new Set()) {
  const hidden = new Set(S.hidden || []), blocked = new Set(S.blocked || []);
  const pool = S.reels.filter(r => r.topic === topicId && r.status !== "out" && !hidden.has(r.id) && !blocked.has(r.handle));
  if (pool.length < 2) return null;
  const wt = r => (r.status === "king" ? RULES.kingWeight : r.status === "qual" ? RULES.qualWeight : 1) * (avoid.has(r.id) ? 0.15 : 1);
  const pick = list => { let s = list.reduce((a, r) => a + wt(r), 0) * Math.random(); for (const r of list) { s -= wt(r); if (s <= 0) return r; } return list.at(-1); };
  const a = pick(pool), b = pick(pool.filter(r => r.id !== a.id));
  return Math.random() < 0.5 ? [a, b] : [b, a];
}
function applyVote(win, lose) {
  const exp = 1 / (1 + 10 ** ((lose.rating - win.rating) / 400));
  const d = Math.max(1, Math.round(RULES.eloK * (1 - exp)));
  win.rating += d; lose.rating -= d; win.w++; lose.l++; win.hist.push(1); lose.hist.push(0);
  const changes = [];
  for (const r of [win, lose]) { const b = r.status; r.status = statusOf(r); if (b !== r.status && (r.status === "king" || r.status === "out")) changes.push(r); }
  save(); return { d, changes };
}

function confetti(n = 150) {
  if (S.reduce) return;
  const c = document.createElement("canvas"); c.className = "fx"; app.appendChild(c);
  const dpr = devicePixelRatio || 1, W = c.width = app.clientWidth * dpr, H = c.height = app.clientHeight * dpr, x = c.getContext("2d");
  const cols = ["#C6FF3D", "#8CFF5A", "#3DFFB0", "#22D3EE", "#3B82F6", "#ffffff"];
  const ps = Array.from({ length: n }, () => ({ x: W / 2, y: H * 0.42, vx: (Math.random() - .5) * 26 * dpr, vy: (-Math.random() * 22 - 6) * dpr,
    s: (5 + Math.random() * 7) * dpr, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: rnd(cols) }));
  let f = 0; (function tick() { x.clearRect(0, 0, W, H); f++;
    ps.forEach(p => { p.vy += .55 * dpr; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.globalAlpha = Math.max(0, 1 - f / 140); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); });
    f < 140 ? requestAnimationFrame(tick) : c.remove(); })();
}

    if (src.blob) $("#rt", sh).onchange = e => { $("#pb", sh).disabled = !e.target.checked; haptic(6); };
    const setTopic = id => { if (id === tp) return; tp = id; sh.querySelectorAll("#tps .chip").forEach(c => { c.classList.toggle("on", c.dataset.t === id); if (c.dataset.t === id) { replay(c, "tabPop .4s var(--spring)"); c.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" }); } });
      if (!url && !code) $("#pv", sh).innerHTML = `<div class="media">${mediaHTML({ topic: tp, src: "fake" }, { thumb: true })}</div>`; };
    sh.querySelectorAll("#tps .chip").forEach(c => c.onclick = () => { touched = true; setTopic(c.dataset.t); haptic(6); });
    $("#cp", sh).oninput = e => { if (!touched) setTopic(suggestTopic(e.target.value)); };
    if (src.link) { const ln = $("#ln", sh), le = $("#le", sh), pb = $("#pb", sh);
      ln.oninput = () => { code = reelCode(ln.value.trim()); le.innerHTML = ""; pb.disabled = !code;
        if (ln.value.trim() && !code) le.innerHTML = `<div class="err">${t("badLink")}</div>`;
        const d = code && findDuplicate({ code }); if (d) { le.innerHTML = `<div class="err">⛔ ${dupMsg(d)}</div>`; pb.disabled = true; haptic([40, 40, 40]); }
        if (code && !d) $("#pv", sh).innerHTML = `<iframe src="https://www.instagram.com/reel/${esc(code)}/embed" style="width:100%;height:100%;border:0" loading="lazy" title="Instagram video"></iframe>`; };
      setTimeout(() => ln.focus(), 400); }
    $("#pb", sh).onclick = async () => {
      if (code && findDuplicate({ code })) return;
      if (src.blob && !$("#rt", sh)?.checked) return;
      const r = mkReel({ owner: "me", handle: S.user.handle, topic: tp, capText: $("#cp", sh).value.trim(), src: src.blob ? "blob" : "link", code, hash: src.hash || null, url: code ? `https://www.instagram.com/reel/${code}/` : "" });
      sh.innerHTML = `<div class="grab"></div><div class="ringwrap"><svg viewBox="0 0 100 100"><defs><linearGradient id="gr"><stop offset="0" stop-color="#C6FF3D"/><stop offset=".5" stop-color="#3DFFB0"/><stop offset="1" stop-color="#3B82F6"/></linearGradient></defs>
        <circle cx="50" cy="50" r="44" stroke="#333"/><circle id="rg" cx="50" cy="50" r="44" stroke="url(#gr)" stroke-dasharray="276.5" stroke-dashoffset="276.5"/></svg>
        <div class="pct" id="pc">0%</div><b>${t("uploading")}</b></div>`;
      if (src.blob) { await idb.put(r.id, src.blob); blobUrls[r.id] = url; }
      let p = 0; const iv = setInterval(() => { p = Math.min(100, p + 4 + Math.random() * 9); const rg = $("#rg", sh), pc = $("#pc", sh); if (!rg) return clearInterval(iv);
        rg.style.strokeDashoffset = 276.5 * (1 - p / 100); pc.textContent = Math.round(p) + "%";
        if (p >= 100) { clearInterval(iv); S.reels.push(r); save(); haptic([10, 40, 10, 40, 30]); close(); confetti();
          toast(`🎉 <div><b>${t("published")}</b><div class="mut">${t("publishedD")}</div></div>`, 3600); setTimeout(() => switchTab("me"), 200); } }, 90);
    };
  });
}
function openCamera() {
  let stream = null, rec = null, chunks = [], facing = "user", t0 = 0, raf = 0;
  const pg = document.createElement("div"); pg.className = "page cam enter";
  pg.innerHTML = `<video id="cv" autoplay muted playsinline></video><div class="camtop"><button class="ibtn" id="cx">${ic("close")}</button><button class="ibtn" id="cf">${ic("flip")}</button></div>
    <div class="timer" id="tm">0:00</div>
    <button class="shut" id="sh" aria-label="record"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="#fff8" stroke-width="6"/><circle id="sr" cx="50" cy="50" r="45" fill="none" stroke="#ff3040" stroke-width="6" stroke-linecap="round" stroke-dasharray="282.7" stroke-dashoffset="282.7"/></svg><div class="dot"></div></button>`;
  app.appendChild(pg);
  const stop = () => { stream?.getTracks().forEach(x => x.stop()); cancelAnimationFrame(raf); };
  const close = () => { stop(); pg.classList.add("leave"); setTimeout(() => pg.remove(), 300); };
  const start = async () => { stop();
    try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 1080 }, height: { ideal: 1920 } }, audio: true }); $("#cv", pg).srcObject = stream; pg.classList.toggle("env", facing === "environment"); }
    catch { if (!$(".camerr", pg)) pg.insertAdjacentHTML("beforeend", `<div class="camerr">${t("camErr")}</div>`); $("#sh", pg).style.display = "none"; } };
  $("#cx", pg).onclick = close;
  $("#cf", pg).onclick = e => { if (rec) return; facing = facing === "user" ? "environment" : "user"; replay(e.currentTarget, "tabPop .45s var(--spring)"); haptic(6); start(); };
  const finish = () => { if (rec?.state === "recording") rec.stop(); };
  const tick = () => { const s = (Date.now() - t0) / 1000; $("#tm", pg).textContent = `0:${String(Math.floor(s)).padStart(2, "0")}`;
    $("#sr", pg).style.strokeDashoffset = 282.7 * (1 - Math.min(1, s / RULES.maxRecordSec)); if (s >= RULES.maxRecordSec) return finish(); raf = requestAnimationFrame(tick); };
  $("#sh", pg).onclick = () => {
    if (!stream) return;
    if (rec) return finish();
    chunks = []; try { rec = new MediaRecorder(stream); } catch { return toast(t("camErr")); }
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    rec.onstop = async () => { const blob = new Blob(chunks, { type: rec.mimeType || "video/webm" }); close(); compose({ blob, hash: await fileHash(blob) }); };
    rec.start(250); t0 = Date.now(); haptic(20); $("#sh", pg).classList.add("rec"); $("#tm", pg).classList.add("on"); tick();
  };
  start();
}

// ---- Boot ----------------------------------------------------------------------------------------
(async () => {
  for (const r of S.reels.filter(x => x.src === "blob")) { const b = await idb.get(r.id); if (b) blobUrls[r.id] = URL.createObjectURL(b); else r.src = "fake"; }
  if (S.step === "main") S.step = "splash";
  renderStep();
})();
</script>
