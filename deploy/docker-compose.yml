# VSV production stack. Started and kept up to date by deploy/bootstrap.sh.
services:
  web:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: always
    expose: ["80"]
    read_only: true
    tmpfs: ["/var/cache/nginx", "/var/run", "/tmp"]
    security_opt: ["no-new-privileges:true"]
  api:
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    restart: always
    expose: ["8080"]
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
    volumes:
      - vsv_data:/data
    read_only: true
    tmpfs: ["/tmp"]
    mem_limit: 512m
    security_opt: ["no-new-privileges:true"]
  caddy:
    image: caddy:2-alpine
    restart: always
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]
    security_opt: ["no-new-privileges:true"]
volumes:
  vsv_data:
  caddy_data:
  caddy_config:
