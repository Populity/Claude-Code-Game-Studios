# VSV production stack. Started and kept up to date by deploy/bootstrap.sh.
services:
  web:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: always
    expose: ["80"]
    read_only: true
    tmpfs: ["/var/cache/nginx", "/var/run", "/tmp"]
    security_opt: ["no-new-privileges:true"]
  caddy:
    image: caddy:2-alpine
    restart: always
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    security_opt: ["no-new-privileges:true"]
volumes:
  caddy_data:
  caddy_config:
