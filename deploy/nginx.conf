server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # Security headers live ONLY at server level: an add_header inside a location drops every
  # server-level add_header for that location, which is how the live site lost them all.
  # Cache policy therefore uses `expires` (not add_header) in the locations below.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), browsing-topics=()" always;
  add_header Cross-Origin-Opener-Policy same-origin always;
  add_header Cross-Origin-Resource-Policy same-origin always;
  # connect-src blob:/data: — the app reads picked files with fetch(blob:...) before uploading.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' blob: data:; worker-src 'self' blob:; frame-src https://www.instagram.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  gzip on; gzip_types text/css application/javascript application/json image/svg+xml;

  location = /healthz { default_type text/plain; return 200 "ok"; }
  location /_expo/ { expires max; }
  location / { try_files $uri /index.html; expires -1; }
}
